name: BorderWise CI

on:
  push:
    branches:
      - main
      - dev
      - agent
      - backend
      - frontend
      - security
      - docs-qa
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        run: python -m pytest -q
